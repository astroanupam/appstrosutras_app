<script>
/* ============ constants ============ */
const SIGNS=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];

const DY={Ketu:7,Venus:20,Sun:6,Moon:10,Mars:7,Rahu:18,Jupiter:16,Saturn:19,Mercury:17};
const ASPECTS={Mars:[7,4,8],Jupiter:[7,5,9],Saturn:[7,3,10],Rahu:[7,5,9],Ketu:[7,5,9]};
const EVENT_TYPES=['Marriage','Career / Job','Child birth','Education','Health / Illness','Finance / Gain','Loss / Setback','Travel / Relocation','Death in family','Other'];
const CITIES={'— choose a city —':null,'Delhi':[28.61,77.21],'Mumbai':[19.08,72.88],'Kolkata':[22.57,88.36],'Chennai':[13.08,80.27],'Bengaluru':[12.97,77.59],'Hyderabad':[17.39,78.49],'Ahmedabad':[23.02,72.57],'Pune':[18.52,73.86],'Jaipur':[26.91,75.79],'Lucknow':[26.85,80.95],'Prayagraj':[25.43,81.85],'Varanasi':[25.32,83.01],'Patna':[25.59,85.14],'Bhopal':[23.26,77.41],'Chandigarh':[30.73,76.78],'Porbandar':[21.64,69.60],'Vadnagar':[23.78,72.64]};
const D2R=Math.PI/180,R2D=180/Math.PI;
const norm=x=>((x%360)+360)%360;

/* ============ Shodashavarga (Parashara) : f(sign 0-11, degree-in-sign) -> varga sign ============ */
const odd=s=>s%2===0; // Aries, Gemini... are odd signs
const VARGAS=[

 {k:'D2',n:'Hora',about:'Wealth',f:(s,d)=>d<15?(odd(s)?4:3):(odd(s)?3:4),alt:(s,d)=>(s*2+Math.floor(d/15))%12},
 {k:'D3',n:'Drekkana',about:'Siblings, courage',f:(s,d)=>(s+4*Math.floor(d/10))%12,alt:(s,d)=>(s*3+Math.floor(d/10))%12},
 {k:'D4',n:'Chaturthamsa',about:'Property, fortune',f:(s,d)=>(s+3*Math.floor(d/7.5))%12,alt:(s,d)=>(s*4+Math.floor(d/7.5))%12},
 {k:'D7',n:'Saptamsa',about:'Children',f:(s,d)=>(s+(odd(s)?0:6)+Math.floor(d*7/30))%12,alt:(s,d)=>(s*7+Math.floor(d*7/30))%12},
 {k:'D9',n:'Navamsa',about:'Spouse, dharma, inner strength',f:(s,d)=>navSign(s*30+d)},
 {k:'D10',n:'Dasamsa',about:'Career, status',f:(s,d)=>(s+(odd(s)?0:8)+Math.floor(d/3))%12,alt:(s,d)=>(s*10+Math.floor(d/3))%12},
 {k:'D12',n:'Dwadasamsa',about:'Parents',f:(s,d)=>(s+Math.floor(d/2.5))%12},
 {k:'D16',n:'Shodasamsa',about:'Vehicles, comforts',f:(s,d)=>([0,4,8][s%3]+Math.floor(d*16/30))%12},
 {k:'D20',n:'Vimsamsa',about:'Worship, spiritual progress',f:(s,d)=>([0,8,4][s%3]+Math.floor(d/1.5))%12},
 {k:'D24',n:'Siddhamsa',about:'Education, learning',f:(s,d)=>((odd(s)?4:3)+Math.floor(d/1.25))%12},
 {k:'D27',n:'Bhamsa',about:'Strengths and weaknesses',f:(s,d)=>([0,3,6,9][s%4]+Math.floor(d*27/30))%12},
 {k:'D30',n:'Trimsamsa',about:'Misfortunes, evils',f:(s,d)=>odd(s)?(d<5?0:d<10?10:d<18?8:d<25?2:6):(d<5?1:d<12?5:d<20?11:d<25?9:7)},
 {k:'D40',n:'Khavedamsa',about:'Maternal legacy, auspicious/inauspicious effects',f:(s,d)=>((odd(s)?0:6)+Math.floor(d/0.75))%12},
 {k:'D45',n:'Akshavedamsa',about:'Paternal legacy, character',f:(s,d)=>([0,4,8][s%3]+Math.floor(d*45/30))%12},
 {k:'D60',n:'Shashtyamsa',about:'Past-life karma, overall results',f:(s,d)=>(s+Math.floor(d*2))%12},
];
/* ============ ayanamsa systems (value in degrees at J2000; precession added by formula) ============ */
const AYAN=[
 {k:'lahiri',name:'Lahiri (Chitrapaksha) – Govt. of India',j:23.85306},
 {k:'raman',name:'B.V. Raman',j:22.41},
 {k:'kp',name:'Krishnamurti (KP)',j:23.76},
 {k:'fagan',name:'Fagan–Bradley (Western Sidereal)',j:24.74},
 {k:'yukt',name:'Sri Yukteshwar',j:22.46},
 {k:'ss',name:'Surya Siddhanta',j:20.90},
 {k:'arya',name:'Aryabhata',j:20.65},
 {k:'truec',name:'True Chitrapaksha (Spica at 180°)',j:23.84},
 {k:'aldeb',name:'Aldebaran at 15° Taurus',j:24.79},
 {k:'galc',name:'Galactic Center at 0° Sagittarius',j:26.40},
 {k:'custom',name:'Custom (your own value)',j:null},
];
function ayanOf(c,T){
  const a=AYAN.find(x=>x.k===(c.ay||'lahiri'))||AYAN[0];
  const base=a.k==='custom'?(isNaN(c.ayCustom)?23.85306:c.ayCustom):a.j;
  return base+1.3968877*T+0.00030707*T*T;
}
/* ============ astronomy ============ */
function tropLon(body,ms){
  const t=Astronomy.MakeTime(new Date(ms));
  const v=Astronomy.GeoVector(body,t,true);
  const r=Astronomy.RotateVector(Astronomy.Rotation_EQJ_ECT(t),v);
  return norm(Math.atan2(r.y,r.x)*R2D);
}
function nodeTrop(ms,type){
  const T=(ms/86400000+2440587.5-2451545)/36525;
  let om=125.0445479-1934.1362891*T+0.0020754*T*T;
  if(type==='true'){
    const r=x=>x*D2R, D=r(297.8501921+445267.1114034*T), M=r(357.5291092+35999.0502909*T), Mp=r(134.9633964+477198.8675055*T), F=r(93.2720950+483202.0175233*T);
    om+=-1.4979*Math.sin(2*(D-F))-0.1500*Math.sin(M)-0.1226*Math.sin(2*D)+0.1176*Math.sin(2*F)-0.0801*Math.sin(2*(Mp-F));
  }
  return norm(om);
}
function navSign(lon){
  const s=Math.floor(lon/30), n=Math.floor((lon%30)/(30/9));
  const start=[s,s+8,s+4][s%3];
  return (start+n)%12;
}
function compute(c){
  const [y,mo,d]=c.date.split('-').map(Number);
  const [hh,mm]=c.time.split(':').map(Number);
  const ms=Date.UTC(y,mo-1,d,hh,mm)-(c.tz+(c.dst||0))*3600000;
  const jd=ms/86400000+2440587.5, T=(jd-2451545)/36525;
  const ayan=ayanOf(c,T);
  const raw={};
  for(const b of ['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn']){
    raw[b]={trop:tropLon(b,ms)};
    if(b!=='Sun'&&b!=='Moon'){
      let dl=tropLon(b,ms+43200000)-tropLon(b,ms-43200000);
      if(dl>180)dl-=360; if(dl<-180)dl+=360;
      raw[b].retro=dl<0;
    }
  }
  const nt=c.node||'mean';
  let ndl=nodeTrop(ms+43200000,nt)-nodeTrop(ms-43200000,nt); if(ndl>180)ndl-=360; if(ndl<-180)ndl+=360;
  const om=nodeTrop(ms,nt);
  raw.Rahu={trop:om,retro:ndl<0}; raw.Ketu={trop:norm(om+180),retro:ndl<0};
  // ascendant
  const gmst=norm(280.46061837+360.98564736629*(jd-2451545)+0.000387933*T*T);
  const th=norm(gmst+c.lon)*D2R, eps=(23.4392911-0.0130042*T)*D2R, ph=c.lat*D2R;
  const ascTrop=norm(Math.atan2(Math.cos(th),-(Math.sin(th)*Math.cos(eps)+Math.tan(ph)*Math.sin(eps)))*R2D);
  const ascLon=norm(ascTrop-ayan), lagna=Math.floor(ascLon/30);
  const hs=c.hs||'whole';
  const hOf=lon=>hs==='equal'?Math.floor(norm(lon-(ascLon-15))/30)+1:hs==='equalstart'?Math.floor(norm(lon-ascLon)/30)+1:((Math.floor(lon/30)-lagna+12)%12)+1;
  const cuspSign=h=>hs==='whole'?(lagna+h-1)%12:Math.floor(norm(ascLon+30*(h-1)+(hs==='equalstart'?15:0))/30);
  const P={};
  for(const n of PLANETS){
    const lon=norm(raw[n].trop-ayan), sign=Math.floor(lon/30);
    let dig='';
    if(EXALT[n]===sign)dig='exalted'; else if(DEBIL[n]===sign)dig='debilitated'; else if(LORD[sign]===n)dig='own';
    const ni=Math.floor(lon/(360/27));
    P[n]={name:n,lon,sign,deg:lon%30,house:hOf(lon),rhouse:((sign-lagna+12)%12)+1,nak:ni,pada:Math.floor((lon%(360/27))/(360/108))+1,retro:!!raw[n].retro,dig,nav:navSign(lon)};
  }
  const C={P,lagna,ascLon,ascNav:navSign(ascLon),ayan,ms,
    hs,lord:h=>LORD[cuspSign(h)],
    aspHouses:p=>(ASPECTS[p]||[7]).map(k=>((P[p].house-1+k-1)%12)+1)};
  C.dasha=dashas(P.Moon.lon,ms);
  C.V={};
  for(const v of VARGAS){const fn=(c.vm==='pari'&&v.alt)?v.alt:v.f;const o={asc:fn(Math.floor(ascLon/30),ascLon%30),P:{}};for(const n of PLANETS)o.P[n]=fn(P[n].sign,P[n].deg);C.V[v.k]=o}
  const mcTrop=norm(Math.atan2(Math.sin(th),Math.cos(th)*Math.cos(eps))*R2D);
  C.ex={raw,T,mc:norm(mcTrop-ayan),ramc:norm(gmst+c.lon),eps,lat:c.lat,lon:c.lon,ms};
  C.AV=ashtakavarga(C);
  try{C.SB=shadbala(C,c)}catch(e){C.SB=null;console.error('shadbala',e)}
  try{C.BB=bhavaBala(C)}catch(e){C.BB=null;console.error('bhavabala',e)}
  return C;

function nextEnd(fn,ms,step,speed){
  const a0=fn(ms),target=((Math.floor(a0/step+1e-9)+1)*step)%360; let t=ms;
  for(let i=0;i<6;i++){t+=w180(target-fn(t))/speed*86400000}
  return t;
}
function panchanga(c,C,ms){
  const tc=t=>(t/86400000+2440587.5-2451545)/36525, off=(c.tz+(c.dst||0))*3600000;
  const sid=(b,t)=>norm(tropLon(b,t)-ayanOf(c,tc(t))), elong=t=>norm(tropLon('Moon',t)-tropLon('Sun',t));
  const el=elong(ms),mS=sid('Moon',ms),sS=sid('Sun',ms);
  const ti=Math.floor(el/12), tithi=ti%15===14?(ti<15?'Purnima':'Amavasya'):TITHIN[ti%15];
  const yi=Math.floor(norm(mS+sS)/(360/27)), ki=Math.floor(el/6), ni=Math.floor(mS/(360/27));
  const T=tc(ms),eps=(23.4392911-0.0130042*T)*D2R,ls=tropLon('Sun',ms)*D2R,dec=Math.asin(Math.sin(eps)*Math.sin(ls));
  const A=Math.acos(Math.max(-1,Math.min(1,-Math.tan(c.lat*D2R)*Math.tan(dec))))*R2D;
  const rise=12-A/15-c.lon/15+c.tz+(c.dst||0), set=12+A/15-c.lon/15+c.tz+(c.dst||0);
  const ld=new Date(ms+off), h=ld.getUTCHours()+ld.getUTCMinutes()/60;
  let wd=ld.getUTCDay(); if(h<rise)wd=(wd+6)%7;
  const vara=WLORD[wd], horaLord=HORA[(HORA.indexOf(vara)+Math.floor(((h-rise)+24)%24))%7];
  const part=(set-rise)/8, seg=i=>[rise+(i-1)*part,rise+i*part], day=set-rise;
  return {
    tithi:{n:ti+1,name:tithi,paksha:ti<15?'Shukla':'Krishna',end:nextEnd(elong,ms,12,12.19)},
    nak:{name:NAKS[ni],pada:Math.floor((mS%(360/27))/(360/108))+1,lord:DORD[ni%9],end:nextEnd(t=>sid('Moon',t),ms,360/27,13.18)},
    yoga:{name:YOGAN[yi],end:nextEnd(t=>norm(sid('Moon',t)+sid('Sun',t)),ms,360/27,14.2)},
    karana:{name:karanaName(ki),end:nextEnd(elong,ms,6,12.19)},
    vara,horaLord,rise,set,moonSign:Math.floor(mS/30),sunSign:Math.floor(sS/30),
    rahu:seg(RAHU_I[wd]),yama:seg(YAMA_I[wd]),guli:seg(GULI_I[wd]),abhijit:[rise+7*day/15,rise+8*day/15],off
  };
}

const TOKEN_RX=/^(?:\s*(?:Su|Mo|Ma|Me|Ju|Ve|Sa|Ra|Ke|As|Ar|Ta|Ge|Cn|Le|Vi|Li|Sc|Sg|Cp|Aq|Pi)ʳ?)+\s*$/;
const _rx={},_memo={hi:new Map(),gu:new Map()};
function langRx(l){
  if(!_rx[l]){const keys=Object.keys(I18N[l]).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&'));
    _rx[l]=new RegExp('(^|[^A-Za-z])('+keys.join('|')+')(?![A-Za-z])','g')}
  return _rx[l];
}
function trText(s,l){
  const m=_memo[l]; if(m.has(s))return m.get(s);
  const d=I18N[l],t=s.trim(); let out=s;
  if(!t){out=s}
  else if(d[t]!==undefined){out=s.replace(t,d[t])}
  else if(TOKEN_RX.test(t)){out=s.replace(/(Su|Mo|Ma|Me|Ju|Ve|Sa|Ra|Ke|As|Ar|Ta|Ge|Cn|Le|Vi|Li|Sc|Sg|Cp|Aq|Pi)/g,k=>ABBR_TR[l][k])}
  else if(t.length<=120){out=s.replace(langRx(l),(x,p,k)=>p+d[k])}
  m.set(s,out); return out;
}
function applyLang(root){
  const l=SET.lang; if(l==='en')return;
  root=root||document.body;
  root.querySelectorAll('[placeholder]').forEach(e=>{const v=e.getAttribute('placeholder'),o=trText(v,l);if(o!==v)e.setAttribute('placeholder',o)});
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){const p=n.parentNode&&n.parentNode.nodeName;const pe=n.parentElement;return(p==='SCRIPT'||p==='STYLE'||p==='TEXTAREA'||p==='NOSCRIPT'||(pe&&pe.closest('[translate="no"]')))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  for(const n of nodes){const v=n.nodeValue,o=trText(v,l);if(o!==v)n.nodeValue=o}
}

function aruData(c,C,vk,o){
  const VV=C.V[vk],n=AMSA_N[vk],pl=30/n,vf=VARGAS.find(v=>v.k===vk).f;
  const lonIn=(sign,deg)=>(vk==='D1'||!o.dlon||vk==='D30')?sign*30+deg:sign*30+((deg%pl)/pl)*30;
  const pSign={},pLon={};PLANETS.forEach(p=>{pSign[p]=VV.P[p];pLon[p]=lonIn(VV.P[p],C.P[p].deg)});
  const ascSign=VV.asc,ascLon=lonIn(ascSign,C.ascLon%30);
  let baseSign=ascSign,baseLon=ascLon;
  if(o.base==='Bhavalagna'){const bl=bhavaLagnaLon(c,C),s=Math.floor(bl/30),d=bl%30,vs=vk==='D1'?s:vf(s,d);baseSign=vs;baseLon=lonIn(vs,d)}
  else if(o.base&&o.base!=='Lagna'){baseSign=pSign[o.base];baseLon=pLon[o.base]}
  const cnt=p=>PLANETS.filter(q=>q!==p&&pSign[q]===pSign[p]).length;
  const stronger=(a,b)=>cnt(a)!==cnt(b)?(cnt(a)>cnt(b)?a:b):(C.P[a].deg>=C.P[b].deg?a:b);
  const lordOf=s=>o.rk&&s===7?stronger('Mars','Ketu'):o.rk&&s===10?stronger('Saturn','Rahu'):LORD[s];
  const arSign=(s,ls,ex)=>{const d=((ls-s+12)%12)+1;let a=(ls+d-1)%12;if(ex&&(a===s||a===(s+6)%12))a=(a+9)%12;return {a,d}};
  const arLon=(own,lord,ex)=>{let a=norm(2*lord-own);const s=Math.floor(own/30),as=Math.floor(a/30);if(ex&&(as===s||as===(s+6)%12))a=norm(a+270);return a};
  const bh=[];
  for(let h=1;h<=12;h++){const s=(baseSign+h-1)%12,L=lordOf(s),ls=pSign[L],r=arSign(s,ls,o.bex);let a=r.a,aLon=null;
    if(o.lon){aLon=arLon(norm(baseLon+30*(h-1)),pLon[L],o.bex);a=Math.floor(aLon/30)}
    bh.push({h,s,lord:L,ls,d:r.d,a,aLon,short:AR_SHORT[h-1],name:AR_NAMES[h-1],house:((a-baseSign+12)%12)+1})}
  const gr=PLANETS.map(p=>{const s=pSign[p],L=lordOf(s),ls=pSign[L],r=arSign(s,ls,o.gex);let a=r.a,aLon=null;
    if(o.lon){aLon=arLon(pLon[p],pLon[L],o.gex);a=Math.floor(aLon/30)}
    return {p,s,lord:L,ls,d:r.d,a,aLon,house:((a-baseSign+12)%12)+1}});
  return {bh,gr,baseSign,baseLon,ascSign};
}

const UKJ_N=200;
const KARAKA7=['Atmakaraka (AK)','Amatyakaraka (AmK)','Bhratrukaraka (BK)','Matrukaraka (MK)','Putrakaraka (PK)','Gnatikaraka (GK)','Darakaraka (DK)'];
const KARAKA8=KARAKA7.concat(['Pitrukaraka (PiK)']);
const KARAKA8_TRAD=['Atmakaraka (AK)','Amatyakaraka (AmK)','Bhratrukaraka (BK)','Matrukaraka (MK)','Pitrukaraka (PiK)','Putrakaraka (PuK)','Gnatikaraka (GK)','Darakaraka (DK)'];
const UKJ_NAMES=['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn','Rahu','Ketu'];
function ukjOpt(){return Object.assign({rahu:'ukj',tb:'none',tbApproved:false,method:'ukj',dstart:'lagna'},(S.ui&&S.ui.ukj)||{})}
function ukjSet(k,v){S.ui=S.ui||{};S.ui.ukj=Object.assign({},S.ui.ukj||{},{[k]:v});save();render()}
/* position inside the occupied Navamsha, in arcminutes (0 <= x < 200); full precision, rounded to 1e-9 only to remove float noise at boundaries */
function ukjPos(degInSign){
  const tot=Math.round(degInSign*60*1e9)/1e9,q=Math.floor(tot/UKJ_N),res=Math.round((tot-q*UKJ_N)*1e9)/1e9;
  const d=Math.floor(res/60),m=Math.floor(res-d*60+1e-12),s=Math.max(0,(res-d*60-m)*60);
  return {total:tot,quot:q,nav:q+1,res,d,m,s};
}
const ukjDMS=(d,m,s)=>`${d}°${pad2(m)}′${s.toFixed(2).padStart(5,'0')}″`;
function ukjCompute(C,scheme,o){
  o=o||ukjOpt();
  const miss=UKJ_NAMES.filter(n=>!C.P[n]||typeof C.P[n].deg!=='number'||isNaN(C.P[n].deg));
  if(miss.length)throw new Error('Planetary input incomplete – missing: '+miss.join(', '));
  const seven=scheme==='7-karaka',kn=seven?KARAKA7:KARAKA8;
  const rows=UKJ_NAMES.map(n=>{const p=C.P[n],u=ukjPos(p.deg);let val=u.res,rev=false;
    if(n==='Rahu'&&o.rahu==='rev'){val=u.res>0?UKJ_N-u.res:0;rev=true}
    return {planet:n,deg:p.deg,sign:p.sign,nav:p.nav,u,val,rev,eligible:n!=='Ketu'&&(!seven||n!=='Rahu'),rank:null,karaka:null,tie:false,tieResolved:false}});
  let el=rows.filter(r=>r.eligible);
  if(el.length!==kn.length)throw new Error('Incorrect number of eligible planetary entries.');
  el.sort((a,b)=>b.val-a.val);
  const ties=[];let i=0;const ordered=[];
  while(i<el.length){let j=i;while(j+1<el.length&&Math.abs(el[j+1].val-el[i].val)<1e-6)j++;
    let grp=el.slice(i,j+1);
    if(grp.length>1){grp.forEach(r=>r.tie=true);ties.push({from:i+1,to:j+1,planets:grp.map(r=>r.planet),val:grp[0].val});
      if(o.tbApproved&&o.tb==='deg'){grp=grp.slice().sort((a,b)=>b.deg-a.deg);grp.forEach(r=>r.tieResolved=true)}}
    ordered.push(...grp);i=j+1}
  ordered.forEach((r,idx)=>{r.rank=idx+1;r.karaka=(r.tie&&!r.tieResolved)?'Tie – unconfirmed (provisional '+kn[idx]+')':kn[idx]});
  return {scheme,kn,rows,ordered,ties};
}
/* traditional Jaimini ranking (sign degree; Rahu = 30° – degree in the 8-scheme) – for the Comparative tab only */
function ukjTrad(C,scheme){
  const seven=scheme==='7-karaka',list=['Sun','Moon','Mars','Mercury','Jupiter','Venus','Saturn'].map(n=>({planet:n,val:C.P[n].deg}));
  if(!seven)list.push({planet:'Rahu',val:30-C.P.Rahu.deg});
  list.sort((a,b)=>b.val-a.val);const kn=seven?KARAKA7:KARAKA8_TRAD;
  return list.map((r,i)=>({...r,rank:i+1,karaka:kn[i]}));
}
/* built-in self tests (the validation table of the specification plus extra cases) */
function ukjSelfTest(){
  const T=[],t=(n,ok,d)=>T.push({name:n,pass:!!ok,detail:d||''}),m=(d,mi,s)=>d+mi/60+(s||0)/3600,near=(a,b,e)=>Math.abs(a-b)<(e||1e-6);
  t('0°00′ → 0 minutes',near(ukjPos(m(0,0)).res,0));
  t('1°00′ → 60 minutes',near(ukjPos(m(1,0)).res,60));
  t('2°00′ → 120 minutes',near(ukjPos(m(2,0)).res,120));
  t('3°00′ → 180 minutes',near(ukjPos(m(3,0)).res,180));
  t('3°19′ → 199 minutes',near(ukjPos(m(3,19)).res,199));
  {const p=ukjPos(m(3,20));t('3°20′ → next Navamsha, 0 minutes',near(p.res,0)&&p.nav===2,'nav '+p.nav+', res '+p.res)}
  {const p=ukjPos(m(18,37));t('18°37′ → 117 minutes (quotient 5, Navamsha 6)',near(p.res,117)&&p.quot===5,'res '+p.res+', q '+p.quot)}
  {const p=ukjPos(m(29,59,59));t('29°59′59″ → residual inside 200′',p.res>=0&&p.res<200&&near(p.res,199.983333,1e-5),'res '+p.res.toFixed(6))}
  t('Decimal seconds: 18°37′30″ → 117.5′',near(ukjPos(m(18,37,30)).res,117.5));
  t('Residual always < 200′ for 0…30° in 0.001° steps',(()=>{for(let d=0;d<30;d+=0.001){const r=ukjPos(d).res;if(!(r>=0&&r<200))return false}return true})());
  t('Navamsha boundaries (every 3°20′) restart at 0′',(()=>{for(let k=0;k<9;k++)if(!near(ukjPos(k*200/60).res,0))return false;return true})());
  // synthetic chart with known residuals
  const mk=r=>{const P={};UKJ_NAMES.forEach(n=>{P[n]={deg:(r[n]+200*3)/60,sign:0,nav:0}});return {P}};
  const R={Sun:150,Moon:20,Mars:180,Mercury:90,Jupiter:60,Venus:199,Saturn:5,Rahu:170,Ketu:120};
  {const res=ukjCompute(mk(R),'7-karaka',{rahu:'ukj',tb:'none'});const ord=res.ordered.map(r=>r.planet+'='+r.karaka.split(' ')[0]).join(', ');
   t('Seven-karaka: Venus AK, Mars AmK, Sun BK, Mercury MK, Jupiter PK, Moon GK, Saturn DK',res.ordered.map(r=>r.planet).join()==='Venus,Mars,Sun,Mercury,Jupiter,Moon,Saturn'&&res.ordered.length===7,ord);
   t('Seven-karaka excludes Rahu and Ketu',!res.rows.find(r=>r.planet==='Rahu').eligible&&!res.rows.find(r=>r.planet==='Ketu').eligible)}
  {const res=ukjCompute(mk(R),'8-karaka',{rahu:'ukj',tb:'none'});
   t('Eight-karaka (UKJ Rahu): Venus, Mars, Rahu, Sun, Mercury, Jupiter, Moon, Saturn(PiK)',res.ordered.map(r=>r.planet).join()==='Venus,Mars,Rahu,Sun,Mercury,Jupiter,Moon,Saturn'&&res.ordered[7].karaka==='Pitrukaraka (PiK)',res.ordered.map(r=>r.planet+':'+r.karaka.split(' ')[0]).join(', '));
   t('Eight-karaka includes Rahu, excludes Ketu',res.rows.find(r=>r.planet==='Rahu').eligible&&!res.rows.find(r=>r.planet==='Ketu').eligible)}
  {const res=ukjCompute(mk(R),'8-karaka',{rahu:'rev',tb:'none'});const rh=res.rows.find(r=>r.planet==='Rahu');t('Configurable Rahu reverse rule (200′ − residual): 170′ → 30′',near(rh.val,30)&&rh.rev,'rank '+rh.rank)}
  {const R2={...R,Mars:199};const res=ukjCompute(mk(R2),'7-karaka',{rahu:'ukj',tb:'none'});const tied=res.ties.length===1&&res.ties[0].planets.sort().join()==='Mars,Venus';
   t('Duplicate positions are flagged, not randomly assigned',tied&&res.ordered[0].karaka.startsWith('Tie – unconfirmed'),JSON.stringify(res.ties));
   const r2=ukjCompute(mk(R2),'7-karaka',{rahu:'ukj',tb:'deg',tbApproved:true});t('Tie-break rule applied only when approved',r2.ordered[0].tieResolved&&!r2.ordered[0].karaka.startsWith('Tie'))}
  {let threw=false;try{const c=mk(R);delete c.P.Ketu;ukjCompute(c,'7-karaka',{})}catch(e){threw=true}t('Validation: missing planet is rejected',threw)}
  // consistency with the natal engine + recalculation after ayanamsha change
  try{const c0=S.charts[0];if(c0){const A=getC(c0),B=getC({...c0,ay:c0.ay==='fagan'?'lahiri':'fagan'});
    const a=ukjCompute(A,'7-karaka',ukjOpt()),b=ukjCompute(B,'7-karaka',ukjOpt());
    t('Reads the natal D-1 degrees exactly (no own astronomy)',a.rows.every(r=>r.deg===A.P[r.planet].deg));
    t('Recalculation after changing the ayanamsha gives new positions',a.rows.some((r,i)=>Math.abs(r.u.res-b.rows[i].u.res)>1e-6),'Sun '+a.rows[0].u.res.toFixed(2)+'′ → '+b.rows[0].u.res.toFixed(2)+'′')}}catch(e){t('Natal consistency tests',false,e.message)}
  return T;
}

   ${note?`<p class="mute" style="margin:8px 0 0">${note}</p>`:''}`;

    return `<details style="margin-bottom:6px"><summary><b>${r.planet}</b> <span class="mute">— ${r.val.toFixed(2)}′ ${r.eligible?'· '+(r.karaka?esc(r.karaka):''):'· excluded'}</span></summary>
    <table style="margin-top:6px"><tr><th>Calculation</th><th>Value</th></tr>
     <tr><td>D-1 sign longitude</td><td>${SIGNS[r.sign]} ${dms(r.deg)} (${r.deg.toFixed(9)}°)</td></tr>

['Disclaimer:','अस्वीकरण:','અસ્વીકરણ:'],
['AppstroSutras is a Vedic astrology research and learning tool. Calculations are approximations; the results, interpretations and rules shown are for educational and research purposes only. They are not a substitute for professional medical, legal, financial or psychological advice, and no outcome is guaranteed. Please verify important results independently before relying on them.','AppstroSutras वैदिक ज्योतिष का एक शोध एवं अध्ययन उपकरण है। गणनाएँ अनुमानित हैं; दिखाए गए परिणाम, व्याख्याएँ और नियम केवल शैक्षिक एवं शोध उद्देश्य के लिए हैं। ये चिकित्सा, कानूनी, वित्तीय या मनोवैज्ञानिक पेशेवर सलाह का विकल्प नहीं हैं और किसी परिणाम की गारंटी नहीं है। कृपया किसी भी महत्वपूर्ण परिणाम पर भरोसा करने से पहले उसे स्वतंत्र रूप से जाँच लें।','AppstroSutras વૈદિક જ્યોતિષનું સંશોધન અને અભ્યાસ સાધન છે. ગણતરીઓ અંદાજિત છે; દર્શાવેલ પરિણામો, અર્થઘટન અને નિયમો માત્ર શૈક્ષણિક અને સંશોધન હેતુ માટે છે. તે તબીબી, કાનૂની, નાણાકીય કે માનસિક વ્યાવસાયિક સલાહનો વિકલ્પ નથી અને કોઈ પરિણામની ખાતરી નથી. કૃપા કરીને કોઈ પણ મહત્વપૂર્ણ પરિણામ પર આધાર રાખતાં પહેલાં તેની સ્વતંત્ર રીતે ચકાસણી કરો.'],

const UKEY='appstrosutras_users',SSKEY='appstrosutras_session';
let L={mode:'in',err:'',user:'',name:'',note:''};
function uLoad(){try{return JSON.parse(localStorage.getItem(UKEY))||{}}catch(e){return {}}}
function uSave(u){try{localStorage.setItem(UKEY,JSON.stringify(u))}catch(e){}}
function rndSalt(){try{return [...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return String(Math.random()).slice(2)+Date.now()}}
async function pwHash(pw,salt){
  try{if(window.crypto&&crypto.subtle){
    const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},k,256);
    return 'p'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h=5381;const s=salt+'|'+pw;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return 'x'+h.toString(16);
}
function authCur(){let n=null;try{n=sessionStorage.getItem(SSKEY)||localStorage.getItem(SSKEY)}catch(e){}const U=uLoad();return n&&U[n]?{id:n,name:U[n].name}:null}
function authInit(){
  if(authCur()){document.body.classList.remove('locked');document.getElementById('login').hidden=true;lkStart();return}
  L.mode=Object.keys(uLoad()).length?'in':'up';L.err='';document.body.classList.add('locked');authRender();
}
function authMode(m){L.mode=m;L.err='';authRender()}
function authRender(){
  const el=document.getElementById('login');el.hidden=false;const up=L.mode==='up';
  el.innerHTML=`<div class="lcard">
   <div translate="no" style="text-align:center"><div class="lbrand">AppstroSutras</div><div class="mute">AppstroSutras by Anoopam Shukla</div></div>
   <div class="row" style="justify-content:center;margin:14px 0 6px"><button class="${up?'':'on'}" onclick="authMode('in')">Sign in</button><button class="${up?'on':''}" onclick="authMode('up')">Create account</button>
    <select translate="no" onchange="setSet('lang',this.value);authRender()" style="margin-left:6px">${opt([['en','English'],['hi','हिन्दी'],['gu','ગુજરાતી']],SET.lang)}</select></div>
   <p class="mute" style="text-align:center;margin:6px 0 10px">${up?'Create your account to begin. It is stored only on this device.':'Welcome back. Sign in to open your workbench.'}</p>
   ${L.note?`<p class="warn" style="text-align:center;margin:0 0 8px"><b>${esc(L.note)}</b></p>`:''}
   <form onsubmit="authSubmit(event)" autocomplete="on">
    ${up?`<label>Your full name</label><input id="lg-name" value="${esc(L.name)}" autocomplete="name">`:''}
    <label>Username</label><input id="lg-user" value="${esc(L.user)}" autocomplete="username" autocapitalize="none">
    <label>Password</label><input id="lg-pw" type="password" autocomplete="${up?'new-password':'current-password'}">
    ${up?`<label>Confirm password</label><input id="lg-pw2" type="password" autocomplete="new-password">`:''}
    <div style="margin:8px 0"><label style="display:inline-flex;gap:6px;align-items:center;margin:0 14px 0 0"><input type="checkbox" onchange="['lg-pw','lg-pw2'].forEach(i=>{const e=document.getElementById(i);if(e)e.type=this.checked?'text':'password'})" style="width:auto"> Show password</label>
     <label style="display:inline-flex;gap:6px;align-items:center;margin:0"><input id="lg-keep" type="checkbox" style="width:auto"> Keep me signed in on this device</label></div>
    ${L.err?`<div style="color:var(--bad);margin:6px 0">${L.err}</div>`:''}
    <button class="pri" type="submit" style="width:100%;margin-top:6px">${up?'Create account':'Sign in'}</button>
    ${up?'':`<div style="text-align:center;margin-top:10px"><a href="#" onclick="authForgot();return false">Forgot password?</a></div>`}
   </form>
   <p class="mute" style="font-size:12px;margin:12px 0 0">Sign-in is a privacy lock for this device. Your charts and rules stay in this browser and are shared by everyone who signs in here.</p>
   <div class="disc" style="margin-top:12px;text-align:center"><div style="font-weight:700;letter-spacing:.4px;color:var(--acc);margin-bottom:4px">LEARN • USE • TEST • THEN TRUST</div>
    <p style="margin:4px 0">Please cross-check important calculations with your previously used software and trusted references. Use your independent judgement and follow your own school of astrology wherever interpretations differ.</p>
    <p style="margin:4px 0">This software is an educational, analytical and research aid—not a guarantee of predictions or a substitute for professional judgement.</p></div></div>`;
  applyLang(el);
}
async function authSubmit(ev){
  ev.preventDefault();
  const g=id=>(document.getElementById(id)||{}).value||'',un=g('lg-user').trim().toLowerCase(),pw=g('lg-pw'),keep=document.getElementById('lg-keep').checked,U=uLoad();
  L.user=un;
  if(L.mode==='up'){
    const nm=g('lg-name').trim();L.name=nm;
    const bad=m=>{L.err=m;authRender()};
    if(!nm||!un)return bad('Please enter your name and a username.');
    if(!/^[a-z0-9._-]{3,30}$/.test(un))return bad('Username: 3–30 letters, numbers, dot, dash or underscore.');
    if(U[un])return bad('That username already exists.');
    if(pw.length<6)return bad('Password must be at least 6 characters.');
    if(pw!==g('lg-pw2'))return bad('The two passwords do not match.');
    const salt=rndSalt();U[un]={name:nm,salt,hash:await pwHash(pw,salt),created:Date.now()};uSave(U);authStart(un,keep);
  }else{
    const u=U[un];
    if(!u||u.hash!==await pwHash(pw,u.salt)){L.err='Incorrect username or password.';authRender();return}
    authStart(un,keep);
  }
}
function authStart(id,keep){
  try{sessionStorage.setItem(SSKEY,id);if(keep)localStorage.setItem(SSKEY,id);else localStorage.removeItem(SSKEY)}catch(e){}
  L={mode:'in',err:'',user:'',name:'',note:''};document.body.classList.remove('locked');document.getElementById('login').hidden=true;lkStart();render();scrollTo(0,0);
}
function authLogout(){try{sessionStorage.removeItem(SSKEY);localStorage.removeItem(SSKEY)}catch(e){}authInit()}
function authForgot(){
  if(!confirm('Reset sign-in on this device?\n\nThis removes the saved account(s) only so you can create a new one. Your charts, rules and consultations are NOT deleted.'))return;
  try{localStorage.removeItem(UKEY);localStorage.removeItem(SSKEY);sessionStorage.removeItem(SSKEY)}catch(e){}
  L={mode:'up',err:'',user:'',name:''};authRender();
}

  };

}

  const X=ygCtx(C),dn=C.dasha&&C.dasha.length?dashaAt(C,now):null;
  let T=null;try{T=c?transitAll(c,C,now):null}catch(e){}
  let recs=[];
  YG_FNS.forEach(f=>{try{recs=recs.concat(f(X))}catch(e){console.error('yoga',f.name,e)}});
  recs.forEach(r=>ygFinal(X,r,dn,T,now,C));
  return {X,recs,dn,T,now};
}

function ygCard(r){
  const cc={Good:'ok',Bad:'bad',Mixed:'warn'}[r.cls],col={Good:'var(--ok)',Bad:'var(--bad)',Mixed:'var(--warn)'}[r.cls];
  const li=(a)=>a.map(x=>`<li>${x.ok?'<span class="ok">✓</span>':'<span class="mute">✗</span>'} ${esc(x.t)}${x.x?` <span class="mute">— ${esc(x.x)}</span>`:''}</li>`).join('');
  const blk=(t,a)=>a.length?`<div style="margin-top:6px"><b>${t}</b><ul style="margin:2px 0 0 18px;padding:0;list-style:none">${li(a)}</ul></div>`:'';

  return `<div class="card" style="border-left:5px solid ${col}"><div class="row" style="align-items:baseline"><b style="font-size:16px" translate="no">${esc(r.name)}</b><span class="tag ${cc}">${r.cls}</span><span class="tag">${esc(r.cat)}</span><span class="mute" style="margin-left:auto">${bar} <b>${Math.round(r.score)}</b>/100 · ${esc(r.final)}</span></div>
   ${r.alt?`<div class="mute" translate="no">${esc(r.alt)}</div>`:''}
   <div style="margin-top:4px"><b>Why it forms here:</b> ${esc(why)}.</div>
   <div style="margin-top:2px"><b>Expected results:</b> ${esc(r.res)}</div>
   <div style="margin-top:2px"><b>Life areas:</b> ${r.dom.length?r.dom.map(d=>`<span class="tag">${d}</span>`).join(' '):'–'} <span class="mute">· Planets: <span translate="no">${esc(pls)}</span> · Source class: ${esc(YG_SRC[r.src])}</span></div>
   <div style="margin-top:2px"><b>Activation now:</b> ${r.act.length?`<span class="${r.active?'ok':'mute'}">${esc(r.act.join('; '))}</span>`:'<span class="mute">Running Mahadasha/Antardasha/Pratyantardasha do not involve these planets</span>'}${r.tr&&r.tr.length?`<div class="mute">${esc(r.tr.join(' · '))}</div>`:''}${r.win&&r.win.length?`<div class="mute">Dasha windows: ${esc(r.win.join(' · '))}</div>`:''}</div>
   <details style="margin-top:6px"><summary><b>Explanation trace</b> (what was tested and the result)</summary>
    ${blk('Mandatory conditions',r.mand)}${blk('Optional / variant conditions',r.opt)}${blk(r.cls==='Bad'?'Intensifying factors':'Strengthening factors',r.str)}${blk(r.cls==='Bad'?'Mitigating factors':'Weakening factors',r.weak)}${blk('Cancellation / modification',r.canc)}
    <div style="margin-top:6px"><b>Participating planets (proposed strength model)</b><table><tr><th>Planet</th><th>Score</th><th>Dignity</th><th>House</th><th>Shadbala</th><th>Influence</th><th>D9</th></tr>${r.pl.map(x=>`<tr><td translate="no">${x.p}</td><td>${Math.round(x.score)}</td><td>${x.dig}${x.comb?' · combust':''}</td><td>${(Math.round(x.hs*100)/100)}</td><td>${(Math.round(x.sb*100)/100)}</td><td>${(Math.round(x.a*100)/100)}</td><td>${(Math.round(x.v*100)/100)}</td></tr>`).join('')}</table></div>
    ${r.note?`<p class="mute" style="margin:6px 0 0">Note: ${esc(r.note)}</p>`:''}</details></div>`;
}
function ygSetW(k,v){S.ui=S.ui||{};S.ui.yw=Object.assign({},S.ui.yw||{});S.ui.yw[k]=Math.max(0,Math.min(100,+v||0));save();render()}

function vYoga(c){

   <span class="mute" style="margin-left:auto">Show:</span>${[['all','All'],['Good','Good'],['Mixed','Mixed'],['Bad','Adverse']].map(([k,l])=>`<button class="sm ${f===k?'on':''}" onclick="V.ygf='${k}';render()">${l}</button>`).join('')}</div>
   ${strongest?`<p style="margin:8px 0 0"><b>Strongest favourable yoga:</b> <span translate="no">${esc(strongest.name)}</span> (${Math.round(strongest.score)}/100).${activeNow.length?` <b>Active in the running period:</b> <span translate="no">${esc(activeNow.slice(0,4).map(r=>r.name).join(', '))}</span>${activeNow.length>4?' …':''}.`:''}</p>`:''}
   <details style="margin-top:8px"><summary><b>Scoring weights</b> (proposed computational model – configurable, not a classical rule)</summary>
    <p class="mute">Strength score (0–100) = weighted average of: planet dignity, house placement, Shadbala ratio, benefic/malefic influence, and D9 support, averaged over the yoga's planets, then +4 per strengthening factor and −6 per weakening factor. Bands: ≥70 Strong, 50–69 Moderate, &lt;50 Weak (for adverse yogas: Intense / Moderate / Mild).</p>
    <div class="row">${[['d','Dignity'],['h','House'],['s','Shadbala'],['a','Influence'],['v','D9']].map(([k,l])=>`<label style="display:inline;margin:0">${l} <input type="number" min="0" max="100" value="${W[k]}" style="width:64px" onchange="ygSetW('${k}',this.value)"></label>`).join('')}<button class="sm" onclick="ygResetW()">Reset</button></div></details></div>`;
  const cards=shown.length?shown.map(ygCard).join(''):'<div class="card mute">No yoga of this kind is formed in the selected horoscope under the implemented rules.</div>';

  const rows=YG_DOM.map(d=>{
    const g=formed.filter(r=>r.cls==='Good'&&r.dom.includes(d)),m=formed.filter(r=>r.cls==='Mixed'&&r.dom.includes(d)),b=formed.filter(r=>r.cls==='Bad'&&r.dom.includes(d));
    const eff=a=>a.filter(r=>!r.cancelled),mx=a=>Math.max(0,...eff(a).map(r=>r.score));
    const gs=mx(g),bs=mx(b);

    if(g.length||b.length||m.length){
      if(eff(g).length&&!eff(b).length)read='Supportive (best '+Math.round(gs)+')';
      else if(!eff(g).length&&eff(b).length)read='Challenging (strongest '+Math.round(bs)+')';
      else if(eff(g).length&&eff(b).length)read=Math.abs(gs-bs)<10?'Contested – comparable strength; the running dasha decides':gs>bs?'Leans supportive ('+Math.round(gs)+' vs '+Math.round(bs)+')':'Leans challenging ('+Math.round(bs)+' vs '+Math.round(gs)+')';

    return `<tr><td><b>${d}</b></td><td>${nm(g)}</td><td>${nm(m)}</td><td>${nm(b)}</td><td>${read}</td></tr>`}).join('');
  const matrix=`<div class="card"><h3>Yoga conflict matrix – by area of life</h3><p class="mute" style="margin-top:0">Good and adverse yogas are not simply listed against each other: for each life area the strongest uncancelled yoga on each side is compared, and ● marks yogas whose planets are active in the running dasha. This is a proposed reading aid – see the explanation trace of each yoga for the reasoning.</p><div style="overflow-x:auto"><table><tr><th>Life area</th><th>Favourable yogas (score)</th><th>Mixed</th><th>Adverse (score)</th><th>Reading</th></tr>${rows}</table></div></div>`;
  const nf=`<div class="card"><details><summary><b>Checked but not formed (${not.length})</b> – and why</summary><div style="overflow-x:auto"><table><tr><th>Yoga</th><th>Class</th><th>First unmet mandatory condition</th></tr>${not.map(r=>`<tr><td translate="no">${esc(r.name)}${r.partial?' <span class="tag">partial</span>':''}</td><td>${r.cls}</td><td class="mute">${esc(r.failed)}</td></tr>`).join('')}</table></div></details></div>`;
  const foot=`<div class="card"><h3>How to read this page</h3>
   <ul style="margin:0 0 0 18px"><li><b>Source classes:</b> <i>Classical</i> = a yoga named in the standard texts (Brihat Parashara Hora Shastra, Brihat Jataka, Phaladeepika, Saravali, Jataka Parijata and others) – <b>verse-level references are not included in this build: SOURCE NOT VERIFIED – FURTHER RESEARCH REQUIRED</b>; <i>Traditional interpretation</i> = commonly taught rule or commentary; <i>Modern / contemporary</i> = popular formulation that is not a primary classical yoga.</li>
   <li><b>Formation ≠ promise ≠ manifestation.</b> A formed yoga only shows a potential; strength, cancellation, the running dasha and transits decide whether and when it acts.</li>
   <li><b>Not yet implemented:</b> longevity (Ayurdaya) and Maraka timing rules and the Arishta family beyond Balarishta (their conditions need verification against the texts first), Jaimini/Karakamsa-based yogas, Kalpadruma, Akhanda Samrajya, Ardhachandra and other less common Nabhasa/Raja yogas, and divisional-chart-specific yogas. The rulebook is being extended batch by batch.</li>
   <li>Differences between authors are shown as <i>optional / variant conditions</i>, never silently turned into mandatory rules. Please cross-check important findings with your own school and trusted references.</li></ul></div>`;
  return head+cards+matrix+nf+foot+ygDisclaimer();
}

function mkSummary(M){
  const ev=mkEval(M),by=c=>ev.filter(x=>x.r.cat===c),K=M.k;
  const rank=e=>MK_EFF.indexOf(e);
  const row=(label,orig,formed,cat,extraConflict)=>{
    const yes=by(cat).filter(x=>x.res.st==='yes'),rev=by(cat).filter(x=>x.res.st==='review');
    let eff='—',final;
    if(yes.length)eff=yes.map(x=>x.r.effect).sort((a,b)=>rank(a)-rank(b))[0];
    const idf=x=>x.r.id.replace('EXC_',''),ids=[...yes.map(idf),...rev.map(x=>idf(x)+' (review)')].join(', ');
    const N=(cat==='Nadi'||cat==='Bhakoot'||cat==='Mangal')?'Dosha':'Low score';
    if(!formed)final='No dosha / mismatch – original result stands';
    else if(yes.length){const f=eff==='Full cancellation';final=(f?N+' present; cancellation recognised under the selected (traditional) reading – score NOT changed':eff==='Partial mitigation'?N+' present; partly mitigated – score NOT changed':N+' present; interpretation modified – score NOT changed')+(extraConflict?' · sources conflict – manual review':'')+(rev.length?' · further rules need manual review':'')}
    else if(rev.length)final=N+' present; exception(s) need manual review: '+rev.map(idf).join(', ');
    else final=N+' present; no applicable exception found – it stands';
    return {label,orig,ids:ids||'—',eff,final};
  };
  const n5=by('Nadi').find(x=>x.r.id==='EXC_NADI_005').res.st==='yes',n6=by('Nadi').find(x=>x.r.id==='EXC_NADI_006').res.st==='yes';
  const mgS=s=>s.any?'formed ('+['Lagna','Moon','Venus'].filter((_,i)=>[s.dos.lagna,s.dos.moon,s.dos.venus][i]).join('+')+')':'not formed';
  const rows=[
   row('Nadi',M.nadi?'Dosha formed ('+K.NADI.boy+' / '+K.NADI.girl+') – 0/8':'Not formed – 8/8',M.nadi,'Nadi',n5!==n6),
   row('Bhakoot',M.bhk?'Dosha formed – '+K.BHAKOOT.bt+' – 0/7':'Not formed – 7/7',M.bhk,'Bhakoot'),
   row('Gana',K.GANA.pts+'/6 ('+K.GANA.boy+' / '+K.GANA.girl+')',M.gmis,'Gana'),
   row('Yoni',K.YONI.pts+'/4',false,'Yoni'),
   row('Tara',K.TARA.pts+'/3',K.TARA.pts<3,'Tara'),
   row('Graha Maitri',K.GRAHA.pts+'/5',false,'Graha Maitri'),
   row('Vashya',K.VASHYA.pts+'/2',false,'Vashya'),
   row('Varna',K.VARNA.pts+'/1',K.VARNA.pts===0,'Varna'),
   row('Mangal','Boy: '+mgS(M.mg.B)+' · Girl: '+mgS(M.mg.G),M.mg.B.any||M.mg.G.any,'Mangal')];
  return {ev,rows};
}

function placidus(C){

function vimshopaka(C){
  const res={};

    for(const [k,sc] of Object.entries(VIMS)){
      let total=0;const rows=[];
      for(const [v,w] of Object.entries(sc.w)){

      res[p][k]={total,rows};
    }
  }
  return res;
}

function transitAll(c,C,ms){

  const C=getC(c), now=dashaAt(C,Date.now());
  const dr=C.dasha.map(m=>`<details><summary><b>${m.lord}</b> ${fd(m.start)} → ${fd(m.end)}</summary>${m.ads.map(a=>`<details style="margin-left:14px"><summary>${m.lord}–${a.lord} &nbsp;<span class="mute">${fd(a.start)} → ${fd(a.end)}</span></summary><table>${a.pds.map(p=>`<tr><td>${m.lord}–${a.lord}–${p.lord}</td><td>${fd(p.start)} → ${fd(p.end)}</td></tr>`).join('')}</table></details>`).join('')}</details>`).join('');
  const ev=(c.events||[]).slice().sort((a,b)=>a.date<b.date?-1:1).map(e=>{const d=dashaAt(C,Date.parse(e.date+'T12:00:00Z'));return `<tr><td>${esc(e.date)}</td><td><span class="tag">${esc(e.type)}</span> ${esc(e.title)}</td><td>${d?d.md+' / '+d.ad+' / '+d.pd:'-'}</td><td><button class="sm danger" onclick="delEvent('${c.id}','${e.id}')">×</button></td></tr>`}).join('');
  const hits=S.rules.filter(r=>ruleMatch(r,C));
  return `<div class="card"><div class="row"><h2 style="margin:0">Chart:</h2>
    <select onchange="V.chartId=this.value;render()">${opt(S.charts.map(x=>[x.id,x.name]),c.id)}</select>
    <span class="mute">${esc(c.date)} ${esc(c.time)} · UTC${c.tz>=0?'+':''}${c.tz}${c.dst?' (DST −'+c.dst+'h)':''} · ${esc(c.place)} (${c.lat}, ${c.lon})</span>
    <div style="width:100%"></div>
    <span>Ayanamsa: <select onchange="setAy('${c.id}',this.value)">${opt(AYAN.map(a=>[a.k,a.name]),c.ay||'lahiri')}</select></span>
    <span>Rahu/Ketu: <select onchange="setOpt('${c.id}','node',this.value)">${opt([['mean','Mean node'],['true','True node']],c.node||'mean')}</select></span>
    <span>Houses: <select onchange="setOpt('${c.id}','hs',this.value)">${opt(HS,c.hs||'whole')}</select></span>
    <span style="margin-left:auto">Style: <button class="sm ${V.style==='south'?'on':''}" onclick="V.style='south';render()">South Indian</button> <button class="sm ${V.style==='north'?'on':''}" onclick="V.style='north';render()">North Indian</button></span></div>
    <p class="mute">Lagna <b>${SIGNS[C.lagna]}</b> ${dm(C.ascLon%30)} · Ayanamsa value ${dm(C.ayan)} · Running dasha now: <b>${now?now.md+' / '+now.ad+' / '+now.pd:'-'}</b></p></div>
  <div class="card"><h3>Planetary details</h3>${planetTable(C)}
    <p class="mute">Rahu/Ketu = ${C.node||'mean'} node. House column follows your selected house system. R = retrograde. Combust orbs: Moon 12°, Mars 17°, Mercury 14°, Jupiter 11°, Venus 10°, Saturn 15°.</p></div>
  <div class="card"><h3>Panchang at birth</h3>${panchangFullHTML(c,C,C.ms)}</div>
  <div class="grid g2"><div class="card">${drawChart(C,'D1')}</div><div class="card">${drawChart(C,'D9')}</div>
   ${C.hs!=='whole'?`<div class="card">${drawBhava(C)}</div><div class="card"><h3>Bhava cusps (${C.hs==='equal'?'Equal Bhava':'Equal House'})</h3><table><tr><th>House</th><th>Start</th><th>Middle</th><th>End</th><th>Lord</th></tr>${cuspRows(C)}</table></div>`:''}</div>
  <div class="grid g2">
   <div class="card"><h3>Vimshottari Dasha – 3 levels (Maha / Antar / Pratyantar)</h3>${dashaNowTable(C,Date.now(),'Now')}<p class="mute">Click a Mahadasha, then an Antardasha, to see its Pratyantardashas.</p>${dr}</div>
  </div>
  <div class="grid g2">
   <div class="card"><h3>Life events &amp; dasha at that time</h3>
     <table><tr><th>Date</th><th>Event</th><th>Mahadasha / Antardasha</th><th></th></tr>${ev||'<tr><td colspan=4 class="mute">No events recorded yet.</td></tr>'}</table>
     <div class="row" style="margin-top:8px"><input id="e_date" type="date"><select id="e_type">${EVENT_TYPES.map(t=>`<option>${t}</option>`).join('')}</select><input id="e_title" placeholder="short description"><button onclick="addEvent('${c.id}')">Add event</button></div></div>
   <div class="card"><h3>Rules that fire on this chart (${hits.length}/${S.rules.length})</h3>
     ${hits.map(r=>`<div style="margin-bottom:8px"><button class="sm" onclick="V.ruleId='${r.id}';go('rules')">${esc(r.title)}</button> <span class="tag">${esc(r.confidence)}</span><div class="mute">${esc(r.prediction)}</div></div>`).join('')||'<p class="mute">No rule matches this chart.</p>'}</div>
  </div>
  <div class="card"><h3>Research notes for this chart</h3><textarea onchange="noteChart('${c.id}',this.value)" style="min-height:120px">${esc(c.notes)}</textarea></div>`;
}
function setAy(id,k){const c=S.charts.find(x=>x.id===id);c.ay=k;if(k==='custom'){const v=parseFloat(prompt('Ayanamsa value at year 2000, in degrees (e.g. 23.85):',c.ayCustom||23.85));c.ayCustom=isNaN(v)?23.85306:v}save();render()}
function setOpt(id,k,v){S.charts.find(x=>x.id===id)[k]=v;save();render()}
function noteChart(id,v){S.charts.find(c=>c.id===id).notes=v;save()}
function addEvent(id){if(!e_date.value||!e_title.value.trim()){alert('Enter date and description');return}
  const c=S.charts.find(x=>x.id===id);(c.events=c.events||[]).push({id:uid('e'),date:e_date.value,type:e_type.value,title:e_title.value.trim()});save();render()}
function delEvent(cid,eid){const c=S.charts.find(x=>x.id===cid);c.events=c.events.filter(e=>e.id!==eid);save();render()}

/* ---- rulebook ---- */
const CONF=['Hypothesis','Testing','Reliable','Rejected'];
function vRules(){
  const r=S.rules.find(x=>x.id===V.ruleId);
  const list=S.rules.map(x=>`<button class="item ${x.id===V.ruleId?'on':''}" onclick="V.ruleId='${x.id}';render()">${esc(x.title)}<br><span class="mute" style="color:inherit;opacity:.7">${esc(x.category)} · ${esc(x.confidence)}</span></button>`).join('');
  return `<div class="split"><div class="card list"><h3>Rulebook (${S.rules.length})</h3><button class="pri" style="width:100%;margin-bottom:8px" onclick="newRule()">+ New rule</button>${list}</div>
  <div>${r?ruleEditor(r):'<div class="card mute">Select a rule on the left, or create a new one.<br><br>A rule = one or more conditions (all must be true) + your prediction. The lab then tests it on every horoscope in your library.</div>'}</div></div>`;
}
function newRule(){const r={id:uid('r'),title:'Untitled rule',category:'General',conds:[{t:'pih',neg:false,...DEFC}],prediction:'',confidence:'Hypothesis',notes:'',evidence:{}};S.rules.unshift(r);V.ruleId=r.id;save();render()}
function fieldHTML(kind,key,val,rid,i){
  const oc=`onchange="setCond('${rid}',${i},'${key}',this.value)"`;
  if(kind==='planet')return `<select ${oc}>${opt(PLANETS.map(p=>[p,p]),val)}</select>`;
  if(kind==='sign')return `<select ${oc}>${opt(SIGNS.map((s,j)=>[j,s]),val)}</select>`;
  if(kind==='house')return `<select ${oc}>${opt([...Array(12)].map((_,j)=>[j+1,'House '+(j+1)]),val)}</select>`;
  if(kind==='houses')return `<input size="9" value="${esc(val)}" ${oc} title="comma separated, e.g. 1,4,7,10" placeholder="1,4,7,10">`;
  if(kind==='dig')return `<select ${oc}>${opt([['exalted','exalted'],['own','in own sign'],['debilitated','debilitated'],['strong','own or exalted']],val)}</select>`;
  if(kind==='num')return `<input size="4" value="${esc(val)}" ${oc} title="number">`;
  if(kind==='varga')return `<select ${oc}>${opt(VARGAS.map(v=>[v.k,v.k+' '+v.n]),val)}</select>`;
  if(kind==='nak')return `<select ${oc}>${opt(NAKS.map((s,j)=>[j,s]),val)}</select>`;
}
function ruleEditor(r){
  const conds=r.conds.map((c,i)=>`<div class="cond"><select onchange="setCondType('${r.id}',${i},this.value)">${opt(Object.entries(CT).map(([k,v])=>[k,v.label]),c.t)}</select>
    ${CT[c.t].f.map(([k,kind])=>fieldHTML(kind,k,c[k],r.id,i)).join('')}
    <label style="display:inline;margin:0"><input type="checkbox" ${c.neg?'checked':''} onchange="setCond('${r.id}',${i},'neg',this.checked,true)"> NOT</label>
    <button class="sm danger" onclick="delCond('${r.id}',${i})">remove</button></div>`).join('');
  let yes=0,no=0,res=S.charts.map(c=>{const C=getC(c),m=ruleMatch(r,C);m?yes++:no++;
    const ev=r.evidence[c.id]||'';
    return `<tr><td>${esc(c.name)}</td><td>${m?'<b class="ok">matches</b>':'<span class="mute">no</span>'}</td>
     <td><select onchange="setEv('${r.id}','${c.id}',this.value)">${opt([['','— not judged —'],['for','Life confirms rule'],['against','Life contradicts rule'],['na','Not applicable']],ev)}</select></td>
     <td><button class="sm" onclick="go('work','${c.id}')">view</button></td></tr>`}).join('');
  const ev=Object.values(r.evidence),nf=ev.filter(v=>v==='for').length,na=ev.filter(v=>v==='against').length;
  return `<div class="card"><div class="row"><input style="flex:1;font-weight:600;font-size:16px" value="${esc(r.title)}" onchange="setRule('${r.id}','title',this.value)">
     <input size="14" value="${esc(r.category)}" onchange="setRule('${r.id}','category',this.value)" title="category">
     <select onchange="setRule('${r.id}','confidence',this.value)">${opt(CONF.map(x=>[x,x]),r.confidence)}</select>
     <button class="danger" onclick="delRule('${r.id}')">Delete rule</button></div>
    <h3 style="margin-top:12px">IF (all conditions true)</h3>${conds||'<p class="mute">No conditions yet.</p>'}
    <button class="sm" onclick="addCond('${r.id}')">+ add condition</button>
    <label>THEN — prediction / meaning (in your words)</label><textarea onchange="setRule('${r.id}','prediction',this.value)">${esc(r.prediction)}</textarea>
    <label>Research notes, exceptions, modifiers</label><textarea onchange="setRule('${r.id}','notes',this.value)">${esc(r.notes)}</textarea></div>
   <div class="card"><h3>Lab test: ${yes} of ${S.charts.length} horoscopes match &nbsp; <span class="mute">Your verdicts: <span class="ok">${nf} confirm</span> · <span class="bad">${na} contradict</span></span></h3>
    <table><tr><th>Horoscope</th><th>Auto-match</th><th>Your judgement from the person's real life</th><th></th></tr>${res}</table>
    <p class="mute">Tip: open a matching horoscope, check its life events and dasha, then record here whether the rule really worked. When confirmations pile up, raise confidence from Hypothesis → Testing → Reliable.</p></div>`;
}
const R_=id=>S.rules.find(r=>r.id===id);
function setRule(id,k,v){R_(id)[k]=v;save();if(k==='title'||k==='category'||k==='confidence')render()}
function setCond(id,i,k,v,rerender){R_(id).conds[i][k]=v;save();render()}
function setCondType(id,i,t){const c=R_(id).conds[i];c.t=t;for(const k in DEFC)if(c[k]===undefined)c[k]=DEFC[k];save();render()}
function addCond(id){R_(id).conds.push({t:'pih',neg:false,...DEFC});save();render()}
function delCond(id,i){R_(id).conds.splice(i,1);save();render()}
function setEv(id,cid,v){R_(id).evidence[cid]=v;save();render()}
function delRule(id){const r=R_(id);if(confirm('Delete rule "'+r.title+'"?')){S.rules=S.rules.filter(x=>x.id!==id);V.ruleId=null;save();render()}}

/* ---- backup ---- */
function vBackup(){
  return `<div class="card"><h2>Your data lives in this browser</h2>
   <p>🔒 <b>Your data stays on this device.</b> Everything (horoscopes, events, rules, verdicts) is saved automatically in this browser on this computer and is never sent anywhere. <b>Download a backup regularly</b>, and use the same file to move to another computer.</p>
   <div class="row"><button class="pri" onclick="dl('kundli-lab-backup.json',JSON.stringify(S,null,1))">Download backup (.json)</button>
   <button onclick="dl('rulebook.md',mdRules())">Download rulebook (.md for AI / wiki)</button>
   <label style="display:inline;margin:0">Restore backup: <input type="file" accept=".json" onchange="restore(this)"></label>
   <label style="display:inline;margin:0">Backup password (for a protected backup): <input type="password" id="bk-rpw" autocomplete="off" style="width:150px"></label></div></div>
  <div class="card"><h3>Password-protected backup</h3>
   <p class="mute" style="margin-top:0">Encrypts the backup file with AES-256 using a key derived from your password (PBKDF2, 200,000 rounds). Use it when you store or send a backup by email or cloud. <b>If you forget this password the backup cannot be recovered</b> – nobody, including this app, can open it without it. To restore, type the password in the “Backup password” box above, then choose the file.</p>
   <div class="row"><input type="password" id="bk-pw" placeholder="Backup password (min 8 characters)" autocomplete="new-password" style="width:260px"><input type="password" id="bk-pw2" placeholder="Repeat password" autocomplete="new-password" style="width:200px"><button class="pri" onclick="bkDownloadEnc()">Download protected backup (.json)</button></div></div>
  <div class="card" style="border:2px solid var(--bad)"><h3 style="color:var(--bad)">Erase data on this device</h3>
   <p class="mute" style="margin-top:0">Download a backup first. Both options ask for confirmation and for you to type ERASE, and cannot be undone.</p>
   <div class="row"><button class="danger" onclick="eraseData(false)">Erase all horoscopes, rules and consultations…</button><button class="danger" onclick="eraseData(true)">Erase everything incl. sign-in accounts and settings…</button></div></div>
  <div class="card"><h3>Rulebook preview (Markdown)</h3><pre style="white-space:pre-wrap;font-size:13px">${esc(mdRules())}</pre></div>`;
}
function dl(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=name;a.click()}
function restore(inp){
  const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=async()=>{
    try{
      let d=JSON.parse(rd.result);
      if(d&&d.format==='ASTROSUTRAS-ENC-1'){
        const pw=(document.getElementById('bk-rpw')||{}).value||'';
        if(!pw){alert('This backup is password-protected.\n\nType its password in the "Backup password" box next to Restore, then choose the file again.');inp.value='';return}
        try{d=JSON.parse(await bkDecrypt(d,pw))}catch(e){alert('Wrong password, or the file is damaged. Nothing was changed.');inp.value='';return}
      }
      if(!d.charts||!d.rules)throw 0;
      if(confirm('Replace ALL current data with this backup?')){S=d;save();render()}
    }catch(e){alert('Not a valid backup file')}
    inp.value='';
  };
  rd.readAsText(f);
}
/* ============ SAFEGUARDS: encrypted backup, erase-data confirmation, auto-lock ============ */
function b64e(buf){const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)}
function b64d(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function bkKey(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function bkEncrypt(text,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await bkKey(pw,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text));
  return JSON.stringify({format:'ASTROSUTRAS-ENC-1',kdf:'PBKDF2-SHA256',iterations:200000,cipher:'AES-256-GCM',salt:b64e(salt),iv:b64e(iv),data:b64e(ct)});
}
async function bkDecrypt(o,pw){const key=await bkKey(pw,b64d(o.salt));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},key,b64d(o.data));return new TextDecoder().decode(pt)}
async function bkDownloadEnc(){
  const p=(document.getElementById('bk-pw')||{}).value||'',p2=(document.getElementById('bk-pw2')||{}).value||'';
  if(!(window.crypto&&crypto.subtle)){alert('Encryption is not available in this browser context (it needs a secure page such as https or the installed app). Use the normal backup instead.');return}
  if(p.length<8){alert('Please use a backup password of at least 8 characters.');return}
  if(p!==p2){alert('The two passwords do not match.');return}
  try{const enc=await bkEncrypt(JSON.stringify(S),p);dl('kundli-lab-backup-protected.json',enc);document.getElementById('bk-pw').value='';document.getElementById('bk-pw2').value='';alert('Protected backup downloaded. Keep the password safe – it cannot be recovered.')}
  catch(e){alert('Could not create the protected backup: '+e.message)}
}
function eraseData(all){
  const w=all?'EVERYTHING on this device: horoscopes, rules, consultations, settings AND the sign-in accounts':'all horoscopes, rules, consultations and preferences on this device';
  if(!confirm('You are about to erase '+w+'.\n\nThis cannot be undone. Have you downloaded a backup?\n\nPress OK only if you want to continue.'))return;
  const t=prompt('Final check – type ERASE (capital letters) to permanently erase the data.');
  if(t!=='ERASE'){alert('Cancelled – nothing was erased.');return}
  try{
    if(all){localStorage.removeItem(KEY);localStorage.removeItem(SKEY);localStorage.removeItem(UKEY);localStorage.removeItem(SSKEY);sessionStorage.clear();location.reload();return}
    S={charts:[],rules:[],ui:{}};save();clearCache();V.chartId=null;V.ruleId=null;go('home');alert('All horoscopes, rules and consultations have been erased from this device.');
  }catch(e){alert('Could not erase: '+e.message)}
}
let LK={last:Date.now(),t:null,bound:false};
const lkMin=()=>SET.lock===undefined?15:+SET.lock;
function lkTouch(){LK.last=Date.now()}
function setLock(v){SET.lock=+v;saveSet();renderCtl();lkTouch()}
function lkStart(){
  if(!LK.bound){['mousemove','keydown','click','touchstart','scroll','wheel'].forEach(e=>window.addEventListener(e,lkTouch,{passive:true,capture:true}));LK.bound=true}
  lkTouch();clearInterval(LK.t);
  LK.t=setInterval(lkCheck,10000);
}
function lkCheck(){const m=lkMin();if(m>0&&authCur()&&Date.now()-LK.last>m*60000)authLock(true)}
function authLock(auto){
  const cur=authCur();try{sessionStorage.removeItem(SSKEY);localStorage.removeItem(SSKEY)}catch(e){}
  L.user=cur?cur.id:'';L.note=auto?'Locked after '+lkMin()+' minutes of inactivity. Sign in to continue.':'';authInit();
}
function mdRules(){
  return '# Vedic Rulebook (Sidereal, Lahiri)\n\n'+S.rules.map(r=>{
    const ev=Object.entries(r.evidence),nm=id=>(S.charts.find(c=>c.id===id)||{}).name;
    const f=ev.filter(e=>e[1]==='for').map(e=>nm(e[0])).filter(Boolean),a=ev.filter(e=>e[1]==='against').map(e=>nm(e[0])).filter(Boolean);
    return `## ${r.title}\n- Category: ${r.category}\n- Confidence: ${r.confidence}\n- IF: ${r.conds.map(condText).join(' AND ')||'(none)'}\n- THEN: ${r.prediction||'-'}\n- Confirmed in: ${f.join(', ')||'-'}\n- Contradicted in: ${a.join(', ')||'-'}\n- Notes: ${r.notes||'-'}\n`}).join('\n');
}

load();ensureCids();render();authInit();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
